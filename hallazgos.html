<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallazgos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hallazgos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .hallazgo { border-radius: 12px; padding: 18px; border-left: 5px solid; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
        .hallazgo h4 { font-size: 15px; margin-bottom: 8px; }
        .hallazgo p { font-size: 13px; line-height: 1.55; color: #455a64; }
        .hallazgo.rosa { background: #fce4ec; border-color: #e91e63; }
        .hallazgo.rosa h4 { color: #c2185b; }
        .hallazgo.azul { background: #e3f2fd; border-color: #2196f3; }
        .hallazgo.azul h4 { color: #1565c0; }
        .hallazgo.naranja { background: #fff3e0; border-color: #ff9800; }
        .hallazgo.naranja h4 { color: #e65100; }
        .hallazgo.verde { background: #e8f5e9; border-color: #4caf50; }
        .hallazgo.verde h4 { color: #2e7d32; }
        .hallazgo.morado { background: #f3e5f5; border-color: #9c27b0; }
        .hallazgo.morado h4 { color: #6a1b9a; }
        .hallazgo.turquesa { background: #e0f7fa; border-color: #00bcd4; }
        .hallazgo.turquesa h4 { color: #00838f; }
        @media (max-width: 1100px) { .hallazgos { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .hallazgos { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="contenedor">
        <aside class="menu">
            <div class="logo">
                <div class="icono-logo"></div>
                <h1>Análisis
                    <span>de Datos de Moda</span>
                </h1>
            </div>

            <nav>
                <a href="index.html">INICIO</a>
                <a href="explorador.html">Explorador de Datos</a>
                <a href="preferencias.html">Preferencias de compra</a>
                <a href="sostenible.html">Moda sostenible</a>
                <a href="economico.html">Análisis económico</a>
                <a href="marcas.html">Marcas</a>
                <a href="estadistica.html">Estadística</a>
                <a href="hallazgos.html" class="activo">Hallazgos</a>
            </nav>

            <div class="menu-final">
                <p>Moda consciente</p>
                <small>Decisiones basadas en datos</small>
            </div>
        </aside>

        <main class="Contenido">
            <header class="encabezado">
                <div>
                    <h2>Hallazgos</h2>
                    <p>Resultados clave del análisis, calculados a partir de los datos.</p>
                </div>

                <div class="filtros">
                    <div class="filtro">
                        <label>Carrera:</label>
                        <select id="filtroCarrera">
                            <option value="Todas">Todas las Carreras</option>
                        </select>
                    </div>

                    <div class="filtro">
                        <label>Edad:</label>
                        <select id="filtroEdad">
                            <option value="Todas">Todas las edades</option>
                        </select>
                    </div>

                    <div class="filtro">
                        <label>Género:</label>
                        <select id="filtroGenero">
                            <option value="Todos">Todos los Géneros</option>
                        </select>
                    </div>

                    <button id="limpiarFiltros">Limpiar Filtros</button>
                </div>
            </header>

            <section class="hallazgos" id="tarjetas"></section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="excel.js"></script>
    <script>
        let ultimaLongitud = -1;

        setInterval(function () {
            if (typeof datosFiltrados === "undefined") return;
            if (datosFiltrados.length === ultimaLongitud) return;
            ultimaLongitud = datosFiltrados.length;
            actualizarHallazgos(datosFiltrados);
        }, 300);

        function numDe(texto, abierto) {
            const t = normalizar(texto);
            if (!t) return NaN;
            if (t.includes("ninguna") || t.includes("nunca")) return 0;
            const nums = (t.match(/\d+/g) || []).map(Number);
            if (!nums.length) return NaN;
            if (t.includes("menos")) return nums[0] / 2;
            if (t.includes("mas de") || t.includes("mas del")) return abierto;
            if (nums.length >= 2) return (nums[0] + nums[1]) / 2;
            return nums[0];
        }

        function pearson(x, y) {
            const n = x.length;
            const mx = x.reduce((a, b) => a + b, 0) / n;
            const my = y.reduce((a, b) => a + b, 0) / n;
            let sxy = 0, sxx = 0, syy = 0;
            for (let i = 0; i < n; i++) {
                sxy += (x[i] - mx) * (y[i] - my);
                sxx += (x[i] - mx) ** 2;
                syy += (y[i] - my) ** 2;
            }
            return sxy / Math.sqrt(sxx * syy);
        }

        function actualizarHallazgos(datos) {
            const total = datos.length;

            const sostenible = calcularPorcentaje(datos, columnas.tipoRopa, ["Moda sostenible"]);
            const diseno = calcularPorcentaje(datos, columnas.criterio, ["Diseño y estilo"]);
            const calidad = calcularPorcentaje(datos, columnas.criterio, ["Buena calidad"]);
            const precioBajo = calcularPorcentaje(datos, columnas.criterio, ["Precio bajo"]);

            const presCategorias = [
                { etiqueta: "menos del 5 %", opciones: ["Menos del 5"] },
                { etiqueta: "entre el 5 % y el 10 %", opciones: ["Entre el 5"] },
                { etiqueta: "entre el 11 % y el 19 %", opciones: ["Entre el 11"] },
                { etiqueta: "más del 20 %", opciones: ["Mas del 20"] }
            ].map(c => ({ etiqueta: c.etiqueta, pct: calcularPorcentaje(datos, columnas.presupuesto, c.opciones) }))
                .sort((a, b) => b.pct - a.pct)[0];

            const adidas = calcularPorcentaje(datos, columnas.marcaPreferida, ["Adidas"]);
            const puma = calcularPorcentaje(datos, columnas.marcaPreferida, ["Puma"]);

            const presupuestoNum = [], prendasNum = [];
            datos.forEach(fila => {
                const p = numDe(fila[columnas.presupuesto], 25);
                const c = numDe(fila[columnas.prendas], 10);
                if (Number.isFinite(p) && Number.isFinite(c)) { presupuestoNum.push(p); prendasNum.push(c); }
            });
            const r = presupuestoNum.length > 2 ? pearson(presupuestoNum, prendasNum) : NaN;

            const dono = calcularPorcentaje(datos, columnas.ropaNoUsa, ["dono", "regalo"]);
            const vendo = calcularPorcentaje(datos, columnas.ropaNoUsa, ["vendo", "reciclo"]);
            const indiceSostenible = redondear(dono + vendo);

            const criterioTop = [
                { etiqueta: "diseño y estilo", pct: diseno },
                { etiqueta: "buena calidad", pct: calidad },
                { etiqueta: "precio bajo", pct: precioBajo }
            ].sort((a, b) => b.pct - a.pct)[0];

            const fuerza = !Number.isFinite(r) ? "" : Math.abs(r) < 0.2 ? "muy débil" : Math.abs(r) < 0.4 ? "débil" : Math.abs(r) < 0.6 ? "moderada" : "fuerte";
            const relacionTexto = !Number.isFinite(r)
                ? "No hay datos suficientes para calcular la relación."
                : Math.abs(r) < 0.2
                    ? `No se encontró una relación lineal significativa entre el presupuesto y el número de prendas compradas (r = ${r.toFixed(2)}).`
                    : `Existe una relación ${r > 0 ? "positiva" : "negativa"} ${fuerza} entre el presupuesto y el número de prendas compradas (r = ${r.toFixed(2)}).`;

            const tarjetas = [
                ["rosa", "Mayor preferencia", `La moda sostenible es la categoría más elegida por los estudiantes (${sostenible}%).`],
                ["azul", "Criterio principal", `El ${criterioTop.etiqueta} es el factor más importante al comprar ropa (${criterioTop.pct}%).`],
                ["naranja", "Presupuesto", `El ${presCategorias.pct}% de los encuestados destina ${presCategorias.etiqueta} de su presupuesto mensual a ropa.`],
                ["verde", "Marcas", `Adidas y Puma son las marcas más preferidas, con ${adidas}% y ${puma}% respectivamente.`],
                ["morado", "Relación económica", relacionTexto],
                ["turquesa", "Compromiso sostenible", `El ${indiceSostenible}% de los encuestados declara donar, regalar, vender o reciclar la ropa que ya no utiliza.`]
            ];

            document.getElementById("tarjetas").innerHTML = tarjetas.map(([color, titulo, texto]) =>
                `<div class="hallazgo ${color}"><h4>${titulo}</h4><p>${texto}</p></div>`).join("");
        }
    </script>
</body>
</html>
